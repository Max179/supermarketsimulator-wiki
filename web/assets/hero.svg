<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="A searched name is matched against the game's class list and data field list">
  <rect width="960" height="260" fill="#12141a"/>
  <rect x="20" y="40" width="260" height="70" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="44" y="72" fill="#9aa3b2" font-family="system-ui,sans-serif" font-size="14">you type a name</text>
  <text x="44" y="96" fill="#e8e8e8" font-family="ui-monospace,monospace" font-size="18">Product</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8ecbff"/></marker></defs>
  <path d="M292 75 H392" stroke="#8ecbff" stroke-width="2" marker-end="url(#a)"/>
  <rect x="404" y="20" width="240" height="110" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="428" y="48" fill="#9aa3b2" font-family="system-ui,sans-serif" font-size="14">the game's own lists</text>
  <text x="428" y="76" fill="#e8e8e8" font-family="ui-monospace,monospace" font-size="15">11,275 class names</text>
  <text x="428" y="102" fill="#e8e8e8" font-family="ui-monospace,monospace" font-size="15">15,236 data field names</text>
  <path d="M656 75 H756" stroke="#8ecbff" stroke-width="2" marker-end="url(#a)"/>
  <rect x="768" y="40" width="172" height="70" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="788" y="72" fill="#9aa3b2" font-family="system-ui,sans-serif" font-size="14">you see</text>
  <text x="788" y="96" fill="#e8e8e8" font-family="ui-monospace,monospace" font-size="15">where it lives</text>
  <text x="20" y="180" fill="#9aa3b2" font-family="system-ui,sans-serif" font-size="13">Read from this installation of the game. Missing information is shown as "unknown" - never guessed.</text>
  <text x="20" y="206" fill="#9aa3b2" font-family="system-ui,sans-serif" font-size="13">Original diagram drawn for this site; no game artwork is redistributed here.</text>
</svg>
