  <rect x="20" y="55" width="200" height="80" rx="12" fill="#1b1f27" stroke="#2a2f3a"/>
  <text x="38" y="86" fill="#9aa3b2" font-family="system-ui,sans-serif" font-size="13">step 1</text>
  <text x="38" y="112" fill="#e8e8e8" font-family="system-ui,sans-serif" font-size="15">A type is chosen</text>
